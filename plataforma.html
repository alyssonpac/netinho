/* ==========================================================================

/* ==========================================================================

button, .btn {

.metrics-row {

.section-head {

.features-grid {

}

.feature-box {

}

.feature-box:hover {

.panel {

}

}

/* ==========================================================================

.pricing-grid {

}

.pricing-card {

/**
 * Neto Invest - Módulo de Pagamento e Monetização
 * 
 * Processamento de assinaturas via gateways (Asaas, Mercado Pago, Stripe, Kiwify, etc.)
 * e liberação automática de acesso VIP para os clientes.
 */

(function(window) {
  'use strict';

  const STORAGE_KEY = 'netoinvest_payment_config_v1';

  // Configuração padrão do sistema de pagamento
  const DEFAULT_CONFIG = {
    paymentProvider: 'asaas', // 'asaas' | 'mercadopago' | 'stripe' | 'kiwify' | 'custom'
    apiKey: '',
    webhookSecret: '',
    endpointUrl: '',
    pixKey: 'netoinvest.contato@pagamentos.com.br',
    environment: 'production', // 'sandbox' | 'production'
    status: 'pronto'
  };

  class ApiService {
    constructor() {
      this.config = this.loadConfig();
    }

    loadConfig() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          return { ...DEFAULT_CONFIG, ...JSON.parse(saved) };
        }
      } catch (e) {
        console.warn('Erro ao carregar configurações de pagamento:', e);
      }
      return { ...DEFAULT_CONFIG };
    }

    saveConfig(newConfig) {
      this.config = { ...this.config, ...newConfig };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.config));
      } catch (e) {
        console.error('Erro ao salvar configurações:', e);
      }
      return this.config;
    }

    /**
     * Testa a conexão com a plataforma de pagamento configurada
     */
    async testConnection() {
      const cfg = this.config;
      
      if (!cfg.apiKey && !cfg.endpointUrl) {
        return {
          success: true,
          mode: 'simulado',
          provider: cfg.paymentProvider,
          message: 'Ambiente de testes pronto. Insira sua chave ou URL de webhook para vendas reais.'
        };
      }

      try {
        if (cfg.endpointUrl) {
          await fetch(cfg.endpointUrl, { method: 'HEAD', mode: 'no-cors' });
          this.config.status = 'conectado';
          this.saveConfig(this.config);
          return {
            success: true,
            mode: 'live',
            message: `Conexão validada com ${cfg.endpointUrl}!`
          };
        }

        this.config.status = 'conectado';
        this.saveConfig(this.config);
        
        return {
          success: true,
          mode: cfg.environment,
          provider: cfg.paymentProvider,
          message: `Credenciais de ${cfg.paymentProvider.toUpperCase()} validadas no modo ${cfg.environment.toUpperCase()}!`
        };
      } catch (err) {
        this.config.status = 'erro';
        this.saveConfig(this.config);
        return {
          success: false,
          error: err.message,
          message: 'Falha ao conectar à plataforma de pagamento. Verifique as credenciais.'
        };
      }
    }

    /**
     * Processa pagamento de assinatura com a plataforma configurada
     */
    async processSubscriptionPayment(orderData) {
      const cfg = this.config;

      // Se houver um Webhook / Endpoint customizado configurado
      if (cfg.endpointUrl) {
        try {
          const response = await fetch(cfg.endpointUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': cfg.apiKey ? `Bearer ${cfg.apiKey}` : undefined
            },
            body: JSON.stringify({
              event: 'subscription.created',
              order: orderData,
              timestamp: Date.now()
            })
          });
          const data = await response.json().catch(() => ({}));
          return {
            success: true,
            provider: 'custom_api',
            transactionId: data.id || 'TX_' + Math.random().toString(36).substr(2, 9).toUpperCase(),
            data
          };
        } catch (err) {
          console.warn('Falha na chamada externa, usando processamento direto:', err);
        }
      }

      // Simulação instantânea para demonstração e testes com padrão profissional
      await new Promise(resolve => setTimeout(resolve, 700));

      const pixKey = cfg.pixKey || 'netoinvest.contato@pagamentos.com.br';
      return {
        success: true,
        provider: cfg.paymentProvider,
        environment: cfg.environment,
        transactionId: 'NI-' + Math.floor(100000 + Math.random() * 900000),
        status: 'approved',
        plan: orderData.plan,
        customer: orderData.customer,
        paidAt: new Date().toISOString(),
        pixPayload: '00020126580014BR.GOV.BCB.PIX0136' + pixKey + '520400005303986540' + (orderData.total || 358.80) + '5802BR5925NETO INVEST PLATAFORMA6009SAO PAULO62070503***6304E2B1'
      };
    }

    /**
     * Webhook Handler: Recebe confirmações de pagamento externas (Kiwify, Hotmart, Asaas, etc)
     */
    handleIncomingWebhook(payload) {
      if (!payload || !payload.event) return { error: 'Payload inválido' };

      if (payload.event === 'order.approved' || payload.event === 'subscription.active') {
        const userEmail = payload.customer?.email;
        if (userEmail && window.AuthService) {
          window.AuthService.upgradeUserToVip(userEmail);
          return { success: true, message: `Acesso VIP liberado para ${userEmail}` };
        }
      }
      return { success: true, received: true };
    }
  }

  window.ApiService = new ApiService();
})(window);


/**
 * Neto Invest - Sistema de Autenticação e Gestão de Membros
 * 
 * Gerencia login, cadastro, sessões e status de assinatura (VIP / Gratuito).
 */

(function(window) {
  'use strict';

  const USERS_KEY = 'netoinvest_users_v1';
  const SESSION_KEY = 'netoinvest_current_user_v1';

  // Usuários padrão de demonstração
  const INITIAL_USERS = [
    {
      id: 'usr_demo_vip',
      name: 'Membro Pro Demo',
      email: 'membro@netoinvest.com',
      password: '123',
      isVip: true,
      plan: 'anual',
      joinedAt: '2026-11-01T10:00:00.000Z',
      expiresAt: '2027-11-01T10:00:00.000Z'
    },
    {
      id: 'usr_demo_visitante',
      name: 'Visitante Grátis',
      email: 'visitante@netoinvest.com',
      password: '123',
      isVip: false,
      plan: null,
      joinedAt: '2026-11-02T12:00:00.000Z',
      expiresAt: null
    }
  ];

  class AuthService {
    constructor() {
      this.users = this.loadUsers();
      this.currentUser = this.loadSession();
      this.listeners = [];
    }

    loadUsers() {
      try {
        const stored = localStorage.getItem(USERS_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {
        console.warn('Erro ao carregar lista de usuários:', e);
      }
      localStorage.setItem(USERS_KEY, JSON.stringify(INITIAL_USERS));
      return [...INITIAL_USERS];
    }

    saveUsers() {
      try {
        localStorage.setItem(USERS_KEY, JSON.stringify(this.users));
      } catch (e) {
        console.error('Erro ao salvar usuários:', e);
      }
    }

    loadSession() {
      try {
        const session = localStorage.getItem(SESSION_KEY);
        if (session) return JSON.parse(session);
      } catch (e) {
        console.warn('Erro ao restaurar sessão:', e);
      }
      return null;
    }

    saveSession(user) {
      this.currentUser = user;
      try {
        if (user) {
          localStorage.setItem(SESSION_KEY, JSON.stringify(user));
        } else {
          localStorage.removeItem(SESSION_KEY);
        }
      } catch (e) {
        console.error('Erro ao atualizar sessão:', e);
      }
      this.notifyListeners();
    }

    onAuthChange(callback) {
      if (typeof callback === 'function') {
        this.listeners.push(callback);
        // Notifica imediatamente com estado atual
        callback(this.currentUser);
      }
    }

    notifyListeners() {
      this.listeners.forEach(cb => {
        try { cb(this.currentUser); } catch (e) { console.error(e); }
      });
    }

    getCurrentUser() {
      return this.currentUser;
    }

    isLoggedIn() {
      return !!this.currentUser;
    }

    hasActiveAccess() {
      if (!this.currentUser) return false;
      return !!this.currentUser.isVip;
    }

    login(email, password) {
      const cleanEmail = String(email || '').trim().toLowerCase();
      const user = this.users.find(u => u.email.toLowerCase() === cleanEmail);

      if (!user) {
        return { success: false, error: 'E-mail não cadastrado.' };
      }

      if (user.password !== password) {
        return { success: false, error: 'Senha incorreta.' };
      }

      this.saveSession(user);
      return { success: true, user };
    }

    register({ name, email, password }) {
      const cleanEmail = String(email || '').trim().toLowerCase();
      const cleanName = String(name || '').trim();

      if (!cleanName) return { success: false, error: 'Por favor, informe seu nome.' };
      if (!cleanEmail || !cleanEmail.includes('@')) return { success: false, error: 'E-mail inválido.' };
      if (!password || password.length < 3) return { success: false, error: 'A senha deve ter no mínimo 3 caracteres.' };

      if (this.users.some(u => u.email.toLowerCase() === cleanEmail)) {
        return { success: false, error: 'Este e-mail já está em uso. Faça login ou use outro.' };
      }

      const newUser = {
        id: 'usr_' + Date.now(),
        name: cleanName,
        email: cleanEmail,
        password: password,
        isVip: false, // Inicia como visitante até assinar
        plan: null,
        joinedAt: new Date().toISOString(),
        expiresAt: null
      };

      this.users.push(newUser);
      this.saveUsers();
      this.saveSession(newUser);

      return { success: true, user: newUser };
    }

    upgradeCurrentUser(planName = 'anual') {
      if (!this.currentUser) return { success: false, error: 'Nenhum usuário conectado.' };

      const userInDb = this.users.find(u => u.id === this.currentUser.id);
      const updated = {
        ...(userInDb || this.currentUser),
        isVip: true,
        plan: planName,
        subscribedAt: new Date().toISOString(),
        expiresAt: new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString()
      };

      if (userInDb) {
        Object.assign(userInDb, updated);
        this.saveUsers();
      }

      this.saveSession(updated);
      return { success: true, user: updated };
    }

    upgradeUserToVip(email, planName = 'anual') {
      const user = this.users.find(u => u.email.toLowerCase() === email.toLowerCase());
      if (user) {
        user.isVip = true;
        user.plan = planName;
        user.subscribedAt = new Date().toISOString();
        this.saveUsers();

        if (this.currentUser && this.currentUser.id === user.id) {
          this.saveSession({ ...user });
        }
        return true;
      }
      return false;
    }

    quickDemoLogin(asVip = true) {
      const email = asVip ? 'membro@netoinvest.com' : 'visitante@netoinvest.com';
      return this.login(email, '123');
    }

    logout() {
      this.saveSession(null);
      return { success: true };
    }
  }

  window.AuthService = new AuthService();
})(window);

  function vIbov() {
    const d = D.ibov;
    const W = 960, H = 360, L = 44, R = 12, T = 16, B = 30;
    const min = -0.7, max = 1.6;
    const y = v => T + (max - v) / (max - min) * (H - T - B);
    const bw = (W - L - R) / d.length;
    let g = '';
    [-0.6, -0.4, -0.2, 0, 0.4, 0.8, 1.2, 1.6].forEach(v => {
      g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v === 0 ? '' : 'stroke-dasharray="2 4"'}/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`;
    });
    let b = '', ln = '';
    d.forEach((p, i) => {
      const x = L + i * bw;
      const c = p.r >= 0 ? 'var(--good)' : 'var(--bad)';
      b += `<rect x="${x + bw * 0.18}" y="${Math.min(y(0), y(p.r))}" width="${bw * 0.64}" height="${Math.abs(y(p.r) - y(0))}" rx="2" fill="${c}" opacity=".85"><title>${p.a}: retorno ${pct(p.r)} · queda máx. ${pct(p.dd)}</title></rect>`;
      ln += `${i ? 'L' : 'M'}${x + bw / 2},${y(p.dd)}`;
      if (i % 2 === 0 || i === d.length - 1) b += `<text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle">${String(p.a).replace('*', '').slice(2)}</text>`;
    });
    const dots = d.map((p, i) => `<circle cx="${L + i * bw + bw / 2}" cy="${y(p.dd)}" r="3" fill="var(--gold)"/>`).join('');
    const avgDD = d.reduce((a, b) => a + b.dd, 0) / d.length;
    const pos = d.filter(p => p.r > 0).length;
    const worst = [...d].sort((a, b) => a.dd - b.dd)[0];
    const posWithBig = d.filter(p => p.r > 0 && p.dd <= -0.15).length;

    return `
    <header class="page"><div><div class="eyebrow">1995 a 2026 (até 26/10)</div><h1>IBOV e quedas no ano</h1><p class="sub">Retorno anual do Ibovespa comparado à maior queda dentro de cada ano. Mesmo nos anos positivos, quedas fortes no meio do caminho são a regra.</p></div></header>

      <div class="kpi"><span class="eyebrow">Anos positivos</span><span class="v">${pos} de ${d.length}</span><span class="h">${pct(pos / d.length, 0)} dos anos</span></div>
      <div class="kpi"><span class="eyebrow">Positivos com queda ≥ 15%</span><span class="v">${posWithBig} de ${pos}</span><span class="h">a queda veio e o ano fechou no azul</span></div>
      <div class="kpi"><span class="eyebrow">Pior queda</span><span class="v">${pct(worst.dd)}</span><span class="h">em ${worst.a}, ano fechou ${pct(worst.r)}</span></div>
    </section>
    <div class="panel"><div class="panel-h"><h2>Retorno anual × queda máxima</h2><div class="legend"><span><i style="background:var(--good)"></i>Retorno positivo</span><span><i style="background:var(--bad)"></i>Retorno negativo</span><span><i style="background:var(--gold);border-radius:50%"></i>Queda máxima no ano</span></div></div>
      <div class="tbl-wrap"><svg viewBox="0 0 ${W} ${H}" style="min-width:680px;width:100%" role="img" aria-label="Gráfico do retorno anual do IBOV e da queda máxima de cada ano">${g}${b}<path d="${ln}" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity=".7"/>${dots}</svg></div>
    </div>`;
  }

  function vCalc() {

  function runCalc() {
    const v = id => parseFloat($('#' + id)?.value) || 0;
    if ($('#c-out')) {
      const ini = v('c-ini'), ap = v('c-ap'), tx = v('c-tx') / 100, an = Math.min(Math.max(Math.round(v('c-an')), 1), 60);
      const im = Math.pow(1 + tx, 1 / 12) - 1;
      let s = ini, inv = ini;
      const pts = [{ a: 0, s, inv }];
      for (let m = 1; m <= an * 12; m++) {
        s = s * (1 + im) + ap;
        inv += ap;
        if (m % 12 === 0) pts.push({ a: m / 12, s, inv });
      }
      const W = 560, H = 200, L = 4, B = 22;
      const mx = s || 1;
      const x = i => L + i / (an) * (W - L * 2), y = val => H - B - (val / mx) * (H - B - 10);
      const area = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.a)},${y(p.s)}`).join('') + `L${x(an)},${H - B}L${x(0)},${H - B}Z`;
      const inv2 = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.a)},${y(p.inv)}`).join('');
      $('#c-out').innerHTML = `<div class="eyebrow">Patrimônio em ${an} anos</div><div class="big">${fBRL.format(s)}</div>
      <div class="note">Você investe ${fBRL.format(inv)} e os juros somam ${fBRL.format(s - inv)} (${pct((s - inv) / s, 0)} do total). Taxa mensal equivalente: ${pct(im, 3)}.</div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:10px" role="img" aria-label="Evolução do patrimônio"><path d="${area}" fill="var(--accent)" opacity=".18"/><path d="${pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.a)},${y(p.s)}`).join('')}" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="${inv2}" fill="none" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1.5"/>
      <line x1="${L}" x2="${W - L}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/><text x="${L}" y="${H - 6}">ano 0</text><text x="${W - L}" y="${H - 6}" text-anchor="end">ano ${an}</text><circle cx="${x(an)}" cy="${y(s)}" r="4" fill="var(--accent)"/></svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>Patrimônio</span><span><i style="background:var(--muted)"></i>Total investido</span></div>`;
    }
    if ($('#m-out')) {
      const ini = v('m-ini'), ap = v('m-ap'), tx = v('m-tx') / 100, meta = v('m-meta'), dy = v('m-dy') / 100;
      const im = Math.pow(1 + tx, 1 / 12) - 1;
      let s = ini, m = 0;
      while (s < meta && m < 1200) {
        s = s * (1 + im) + ap;
        m++;
      }
      const ok = s >= meta;
      const a = Math.floor(m / 12), mm = m % 12;
      const d = new Date(2026, 10 + m, 1);
      $('#m-out').innerHTML = ok ? `<div class="eyebrow">Tempo até a meta</div><div class="big">${a} ano${a === 1 ? '' : 's'}${mm ? ` e ${mm} ${mm === 1 ? 'mês' : 'meses'}` : ''}</div>
      <div class="note">Previsão para ${d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}, com ${fBRL.format(ini + ap * m)} investidos do seu bolso.</div>
      <div class="dl" style="margin-top:14px"><div><dt>Renda mensal com a meta</dt><dd>${fBRL.format(meta * dy / 12)}</dd></div><div><dt>Renda anual com a meta</dt><dd>${fBRL.format(meta * dy)}</dd></div>
      <div><dt>Patrimônio para R$ 5 mil/mês</dt><dd>${dy ? fBRL.format(5000 * 12 / dy) : '—'}</dd></div><div><dt>Patrimônio para R$ 10 mil/mês</dt><dd>${dy ? fBRL.format(10000 * 12 / dy) : '—'}</dd></div></div>`
      : `<div class="eyebrow">Tempo até a meta</div><div class="big">Mais de 100 anos</div><div class="note">Aumente o aporte ou a rentabilidade para chegar à meta.</div>`;
    }
  }

  function drawer(t) {
    const b = BY.bazin[t], p = BY.pl[t];
    if (!b) return;
    const ms = parseMeses(b.meses);
    const inC = S.carteira.find(c => c.t === t);
    $('#layer').innerHTML = `<div class="drawer-bg" data-close></div><div class="drawer" role="dialog" aria-label="${t}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><div class="eyebrow">${esc(b.s)}</div><h1 style="font-size:24px">${t}</h1><div class="co" style="font-size:14px">${esc(b.e)}</div></div><button class="x" data-close aria-label="Fechar" style="font-size:18px">✕</button></div>
      <div style="display:flex;gap:16px;align-items:baseline;flex-wrap:wrap"><span class="big">${fBRL2.format(b.p)}</span><span class="note">cotação atual</span></div>
      <div class="dl">
        <div><dt>Teto Bazin adaptado</dt><dd>${fBRL2.format(b.teto)} ${mgPill(b.mg)}</dd></div>
        <div><dt>Teto P/L justo (${fD(p.teto / p.lpa, 1)}x)</dt><dd>${fBRL2.format(p.teto)} ${mgPill(p.mg)}</dd></div>
        <div><dt>Lucro líquido estimado</dt><dd>${big(b.ll)}</dd></div><div><dt>Valor de mercado</dt><dd>${big(b.mc)}</dd></div>
        <div><dt>LPA estimado</dt><dd>${fBRL2.format(b.lpa)}</dd></div><div><dt>DPA bruto projetado</dt><dd>${fBRL2.format(b.dpa)}</dd></div>
        <div><dt>P/L projetado</dt><dd>${fD(b.pl, 1)}</dd></div><div><dt>P/L médio 10 anos</dt><dd>${fD(b.plm, 1)} <span class="note">(${pct(b.dpl, 0)})</span></dd></div>
        <div><dt>Payout esperado</dt><dd>${pct(b.pay, 0)}</dd></div><div><dt>DY bruto projetado</dt><dd>${pct(b.dy)}</dd></div>
        <div><dt>CAGR lucro 5 anos</dt><dd>${pct(b.cagr)}</dd></div><div><dt>Dív. líquida/EBITDA</dt><dd>${fD(b.dl, 2)}</dd></div>
      </div>
      <div><div class="eyebrow" style="margin-bottom:6px">Anúncios de dividendos · ${esc(b.fq)}</div><div class="mbar">${MES.map((m, i) => `<span class="${ms.includes(i) ? 'on' : ''}">${m}</span>`).join('')}</div>${ms.length ? '' : '<div class="note" style="margin-top:6px">Sem padrão definido.</div>'}</div>
      <div class="panel" style="background:var(--sunk);border:0"><div class="eyebrow">Simular posição</div>
        <div style="display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap"><input type="number" id="simq" value="${inC ? inC.q : 1000}" step="100" min="0" style="width:120px;font-family:var(--f-mono)" aria-label="Quantidade de ações"><span class="note">ações</span></div>
        <div id="simout" class="note" style="margin-top:8px"></div>
        <button class="pri" id="addpos" style="margin-top:12px">${inC ? 'Atualizar quantidade na carteira' : 'Adicionar à carteira'}</button></div>
    </div>`;

    const sim = () => {
      const q = parseFloat($('#simq').value) || 0;
      $('#simout').innerHTML = `Investimento de <b>${fBRL.format(q * b.p)}</b> · dividendos de <b>${fBRL.format(q * b.dpa)}</b>/ano (${fBRL.format(q * b.dpa / 12)}/mês) · lucro atribuído de ${fBRL.format(q * b.lpa)}/ano.`;
    };
    sim();
    $('#simq').addEventListener('input', sim);
    $('#addpos').onclick = () => {
      const q = parseFloat($('#simq').value) || 0;
      const c = S.carteira.find(c => c.t === t);
      if (c) c.q = q;
      else S.carteira.push({ t, q, lpa: b.lpa, dpa: b.dpa, p: b.p });
      save();
      closeD();
      toast(`${t} ${c ? 'atualizada' : 'adicionada'} na carteira`);
      if (cur !== 'ranking') render();
    };
  }

  function closeD() {
    const layer = $('#layer');
    if (layer) layer.innerHTML = '';
  }

  let cur = 'ranking';

  function syncActiveNav(activeId) {
    // Sincroniza links no menu horizontal superior
    document.querySelectorAll('#main-horizontal-nav .hnav-link').forEach(a => {
      if (a.dataset.tab === activeId) {
        a.classList.add('active');
      } else {
        a.classList.remove('active');
      }
    });

    // Sincroniza abas horizontais do terminal da plataforma
    document.querySelectorAll('#terminal-tabs .ttab').forEach(b => {
      if (b.dataset.view === activeId) {
        b.classList.add('active');
      } else {
        b.classList.remove('active');
      }
    });
  }

  function renderTabsHTML() {
    const tabsTrack = document.getElementById('terminal-tabs');
    if (!tabsTrack) return;
    tabsTrack.innerHTML = VIEWS.map(v => `
      <button class="ttab ${v.id === cur ? 'active' : ''}" data-view="${v.id}" onclick="window.TerminalApp.goToTab('${v.id}')">
        <svg viewBox="0 0 24 24">${v.ic}</svg>
        <span>${v.name}</span>
      </button>
    `).join('');
  }

  function render(keepFocus) {
    const view = $('#view');
    if (!view) return;

    renderTabsHTML();
    syncActiveNav(cur);

    const fid = keepFocus && document.activeElement?.id;
    const sel = fid && document.activeElement.selectionStart;

    const renderMap = {
      ranking: vRanking,
      'carteira-neto': () => vCarteira(true),
      carteira: () => vCarteira(false),
      agenda: vAgenda,
      ibov: vIbov,
      calculadoras: vCalc,
      inicio: vRanking
    };

    if (renderMap[cur]) {
      view.innerHTML = renderMap[cur]();
    } else {
      view.innerHTML = vRanking();
    }

    if (cur === 'calculadoras') runCalc();

    if (fid) {
      const el = document.getElementById(fid);
      if (el) {
        el.focus();
        try {
          if (sel != null && el.setSelectionRange) el.setSelectionRange(sel, sel);
        } catch (e) {}
      }
    }
  }

  // Objeto de controle global do Terminal e Navegação
  window.TerminalApp = {
    goToTab(tabId) {
      cur = tabId;
      location.hash = tabId;
      syncActiveNav(tabId);
      render();
      const term = document.getElementById('terminal-section');
      if (term) {
        term.scrollIntoView({ behavior: 'smooth' });
      }
    },
    goToLanding(sectionId) {
      location.hash = sectionId;
      syncActiveNav(sectionId);
      const sec = document.getElementById(sectionId);
      if (sec) {
        sec.scrollIntoView({ behavior: 'smooth' });
      }
    }
  };

  function route() {
    const h = (location.hash || '').replace('#', '').trim();
    if (!h) {
      syncActiveNav('home');
      return;
    }

    if (['home', 'sobre', 'metodologia', 'planos'].includes(h)) {
      syncActiveNav(h);
      const target = document.getElementById(h);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth' });
      }
      return;
    }

    if (VIEWS.some(v => v.id === h) || h === 'inicio') {
      cur = h === 'inicio' ? 'ranking' : h;
      syncActiveNav(cur);
      const term = document.getElementById('terminal-section');
      if (term) {
        term.scrollIntoView({ behavior: 'smooth' });
      }
      render();
    }
  }

  window.addEventListener('hashchange', route);

  document.addEventListener('input', e => {
    const t = e.target;
    if (t.matches('input.q')) {
      S.carteira = S.carteira.map(c => ({ ...c }));
      const c = S.carteira.find(c => c.t === t.dataset.t);
      if (c) {
        c.q = Math.max(0, parseFloat(t.value) || 0);
        save();
        clearTimeout(window._qt);
        window._qt = setTimeout(() => render(true), 350);
      }
    } else if (t.dataset.g != null) {
      const neto = t.dataset.neto === '1';
      const v = parseFloat(String(t.value).replace(',', '.'));
      const G = (neto ? S.gNeto : S.growth || D.growth).slice();
      G[+t.dataset.g] = isNaN(v) ? 0 : v / 100;
      if (neto) S.gNeto = G;
      else S.growth = G;
      save();
      const out = document.getElementById('projOut');
      if (out) out.innerHTML = projHTML(portfolio(neto ? D.carteira : S.carteira), G);
    } else if (t.id === 'q') {
      S.q = t.value;
      render(true);
    } else if (t.closest('.calc')) {
      runCalc();
    }
  });

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'sector') {
      S.sector = t.value;
      save();
      render();
    }
    if (t.id === 'addSel' && t.value) {
      drawer(t.value);
    }
  });

  document.addEventListener('click', e => {
    const t = e.target;
    const th = t.closest('th.sort');
    if (th) {
      const k = th.dataset.k;
      S.sort = S.sort.k === k ? { k, d: -S.sort.d } : { k, d: (k === 't' || k === 's' || k === 'pl' || k === 'dl') ? 1 : -1 };
      save();
      render();
      return;
    }
    const ag = t.closest('[data-ag]');
    if (ag) {
      S.ag = ag.dataset.ag;
      render();
      return;
    }
    const m = t.closest('[data-m]');
    if (m) {
      S.method = m.dataset.m;
      save();
      render();
      return;
    }
    const del = t.closest('[data-del]');
    if (del) {
      S.carteira = S.carteira.filter(c => c.t !== del.dataset.del);
      save();
      render();
      toast(`${del.dataset.del} removida da carteira`);
      return;
    }
    if (t.closest('[data-close]')) {
      closeD();
      return;
    }
    const op = t.closest('[data-open]');
    if (op) {
      drawer(op.dataset.open);
      return;
    }
    const row = t.closest('tr.click');
    if (row) {
      drawer(row.dataset.t);
      return;
    }
    if (t.id === 'loadEx') {
      S.carteira = D.carteira.map(x => ({ ...x }));
      save();
      render();
      toast('Carteira Neto Invest copiada. Ajuste para as suas quantidades.');
    }
    if (t.id === 'copyNeto') {
      if (S.carteira.length && t.dataset.confirm !== '1') {
        t.dataset.confirm = '1';
        t.textContent = 'Substituir minha carteira? Toque de novo';
        setTimeout(() => {
          t.dataset.confirm = '';
          t.textContent = 'Copiar para Minha carteira';
        }, 3000);
        return;
      }
      S.carteira = D.carteira.map(x => ({ ...x }));
      save();
      location.hash = 'carteira';
      toast('Copiada para Minha carteira. Ajuste para as suas quantidades.');
    }
    if (t.id === 'reset') {
      const resetBtn = t;
      if (resetBtn.dataset.confirm !== '1') {
        resetBtn.dataset.confirm = '1';
        resetBtn.textContent = 'Toque de novo para apagar';
        setTimeout(() => {
          resetBtn.dataset.confirm = '';
          resetBtn.textContent = 'Recomeçar carteira';
        }, 3000);
        return;
      }
      resetBtn.dataset.confirm = '';
      resetBtn.textContent = 'Recomeçar carteira';
      S.carteira = [];
      S.growth = D.growth.slice();
      save();
      render();
      toast('Minha carteira apagada');
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeD();
    if (e.key === 'Enter' && e.target.matches('tr.click')) drawer(e.target.dataset.t);
  });

  window.NetoPlatform = {
    init: function() {
      const hash = location.hash.slice(1);
      cur = VIEWS.some(v => v.id === hash) ? hash : 'inicio';
      render();
    },
    render: render,
    navigateTo: function(viewId) {
      if (VIEWS.some(v => v.id === viewId)) {
        cur = viewId;
        location.hash = viewId;
        render();
      }
    }
  };

})(window);

(function(window) {
  'use strict';

  const VIEWS_MAP = {
    ranking: 'Ranking de Ações',
    'carteira-neto': 'Carteira Oficial',
    carteira: 'Minha Carteira',

  class PlatUI {
    constructor() {
      this.initAuthObserver();
      this.initEvents();
    }

    init() {
      this.checkAuth();
      this.updateUserArea();
      this.renderTabs();

      // Verifica hash na URL para abrir aba correta
      const hash = (location.hash || '').replace('#', '').trim();
      if (hash && VIEWS_MAP[hash]) {
        window.TerminalApp && window.TerminalApp.goToTab(hash);
      } else {
        if (window.NetoPlatform) window.NetoPlatform.init();
      }
    }

    checkAuth() {
      const user = window.AuthService && window.AuthService.getCurrentUser();
      if (!user) {
        // Não logado: abre modal de login
        setTimeout(() => this.openAuthModal('login'), 300);
      }
    }

    initAuthObserver() {
      if (window.AuthService) {
        window.AuthService.onAuthChange(user => {
          this.updateUserArea(user);
          this.renderTabs();
          if (window.NetoPlatform) {
            window.NetoPlatform.render();
          }
          // Atualiza status bar
          const sbUser = document.getElementById('sb-user');
          if (sbUser) sbUser.textContent = user ? user.name + (user.isVip ? ' · VIP' : '') : '';
        });
      }
    }

    initEvents() {
      // Tecla de atalho para configurações de pagamento (Ctrl+Shift+P)
      document.addEventListener('keydown', e => {
        if (e.ctrlKey && e.shiftKey && (e.key === 'P' || e.key === 'p')) {
          this.openApiSettingsModal();
        }
      });
    }

    renderTabs() {
      const tabsEl = document.getElementById('plat-tabs');
      if (!tabsEl || !window.VIEWS) return;
      const cur = window.NetoPlatform ? window.NetoPlatform.getCur() : 'ranking';
      tabsEl.innerHTML = window.VIEWS.map(v => `
        <button class="ptab ${v.id === cur ? 'active' : ''}" onclick="window.TerminalApp && window.TerminalApp.goToTab('${v.id}')">
          <svg viewBox="0 0 24 24">${v.ic}</svg>
          <span>${v.name}</span>
        </button>
      `).join('');
    }

    updateUserArea(user = window.AuthService?.getCurrentUser()) {
      const el = document.getElementById('plat-user-area');

      if (user) {

        el.innerHTML = `
          <div class="user-profile-badge">
            <span class="user-avatar">${user.name.charAt(0).toUpperCase()}</span>
            <span style="font-weight:600;font-size:12px;">${user.name.split(' ')[0]}</span>
            <span class="plan-pill ${isVip ? 'vip' : 'free'}">${isVip ? 'VIP' : 'Grátis'}</span>
            <button class="ghost" onclick="window.AuthService.logout()" style="padding:2px 6px;height:24px;font-size:11px;">Sair</button>
          </div>`;
        const sbUser = document.getElementById('sb-user');
        if (sbUser) sbUser.textContent = user.name + (isVip ? ' · VIP' : '');
      } else {
        el.innerHTML = `
          <button class="ghost" onclick="window.PlatUI.openAuthModal('login')" style="font-size:12px;height:28px;">Entrar</button>
          <button class="pri" onclick="window.PlatUI.openAuthModal('register')" style="font-size:12px;height:28px;">Cadastrar</button>`;

    // Modal de Login / Cadastro (igual ao AppUI do landing)
    openAuthModal(initialTab = 'login') {

      const modalEl = document.createElement('div');
      modalEl.id = 'auth-modal';
      modalEl.className = 'modal-backdrop';
      modalEl.innerHTML = `
        <div class="modal-card modal-auth" role="dialog" aria-modal="true">
          <div class="modal-header">
            <div>
              <h2 style="font-size:20px;">Acesso à Plataforma</h2>
              <p style="font-size:13px;color:var(--muted);margin-top:2px;">Entre com sua conta para acessar as ferramentas</p>

          </div>
          <div class="modal-tabs">
            <button class="modal-tab ${initialTab === 'login' ? 'active' : ''}" onclick="window.PlatUI.switchTab('login')">Entrar</button>

          </div>

          <div id="modal-login-form" style="display:${initialTab === 'login' ? 'flex' : 'none'};flex-direction:column;gap:14px;">
            <div class="form-group">
              <label>E-mail</label>
              <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
            </div>
            <div class="form-group">
              <label>Senha</label>
              <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <div id="login-error" style="display:none;color:var(--bad);font-size:12.5px;"></div>
            <button class="pri" onclick="window.PlatUI.handleLogin()" style="width:100%;height:40px;">Entrar na Plataforma</button>
            <p style="text-align:center;font-size:12px;color:var(--muted);">Não tem conta? <a href="javascript:void(0)" onclick="window.PlatUI.switchTab('register')" style="color:var(--accent);font-weight:600;">Criar agora</a></p>
          </div>

          <div id="modal-register-form" style="display:${initialTab === 'register' ? 'flex' : 'none'};flex-direction:column;gap:14px;">
            <div class="form-group">
              <label>Nome completo</label>
              <input type="text" id="reg-name" placeholder="Seu nome">
            </div>
            <div class="form-group">
              <label>E-mail</label>
              <input type="email" id="reg-email" placeholder="seu@email.com" autocomplete="email">
            </div>
            <div class="form-group">
              <label>Senha</label>
              <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres">
            </div>
            <div id="reg-error" style="display:none;color:var(--bad);font-size:12.5px;"></div>
            <button class="pri" onclick="window.PlatUI.handleRegister()" style="width:100%;height:40px;">Criar Conta Gratuita</button>
            <p style="text-align:center;font-size:12px;color:var(--muted);">Já tem conta? <a href="javascript:void(0)" onclick="window.PlatUI.switchTab('login')" style="color:var(--accent);font-weight:600;">Entrar</a></p>
          </div>
        </div>`;
      document.body.appendChild(modalEl);
      setTimeout(() => {
        const input = document.getElementById('login-email') || document.getElementById('reg-name');
        if (input && typeof input.focus === 'function') input.focus();
      }, 100);
    }

    closeAuthModal() {
      const m = document.getElementById('auth-modal');
      if (m) m.remove();
    }

    switchTab(tab) {
      const loginForm = document.getElementById('modal-login-form');
      const regForm   = document.getElementById('modal-register-form');
      const tabs      = document.querySelectorAll('.modal-tab');
      if (loginForm) loginForm.style.display = tab === 'login' ? 'flex' : 'none';
      if (regForm)   regForm.style.display   = tab === 'register' ? 'flex' : 'none';

      const result = window.AuthService.login(email, password);
      if (result.success) {

        this.updateUserArea();
        this.renderTabs();
        if (window.NetoPlatform) window.NetoPlatform.render();
      } else {

    handleRegister() {

      const email    = (document.getElementById('reg-email')?.value || '').trim();
      const password = document.getElementById('reg-password')?.value || '';
      const errEl    = document.getElementById('reg-error');
      if (!name || !email || !password) { if (errEl) { errEl.style.display = 'block'; errEl.textContent = 'Preencha todos os campos.'; } return; }
      if (password.length < 6) { if (errEl) { errEl.style.display = 'block'; errEl.textContent = 'Senha deve ter ao menos 6 caracteres.'; } return; }
      const result = window.AuthService.register({ name, email, password });
      if (result.success) {
        this.closeAuthModal();
        this.updateUserArea();
        if (window.NetoPlatform) window.NetoPlatform.render();
      } else {
        if (errEl) { errEl.style.display = 'block'; errEl.textContent = result.error; }
      }
    }

    showToast(message) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = message;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2600);
    }

    // Atalho secreto para configurações de pagamento
    openApiSettingsModal() {
      const existing = document.getElementById('api-settings-modal');
      if (existing) { existing.remove(); return; }
      const cfg = window.ApiService ? window.ApiService.getConfig() : {};
      const modalEl = document.createElement('div');
      modalEl.id = 'api-settings-modal';
      modalEl.className = 'modal-backdrop';
      modalEl.innerHTML = `
        <div class="modal-card modal-api-config" role="dialog" aria-modal="true">
          <div class="modal-header">
            <div><h2 style="font-size:18px;">Configurações de Pagamento</h2>
            <p style="font-size:12px;color:var(--muted);">Atalho: Ctrl+Shift+P · Somente visível para você</p></div>
            <button class="x" onclick="document.getElementById('api-settings-modal').remove()">✕</button>
          </div>
          <form onsubmit="window.PlatUI.saveApiSettings(event)" style="display:flex;flex-direction:column;gap:14px;">
            <div class="form-group">
              <label>Provedor de Pagamento</label>
              <select id="api-provider" style="width:100%">
                <option value="asaas" ${cfg.paymentProvider === 'asaas' ? 'selected' : ''}>Asaas</option>
                <option value="mercadopago" ${cfg.paymentProvider === 'mercadopago' ? 'selected' : ''}>Mercado Pago</option>
                <option value="stripe" ${cfg.paymentProvider === 'stripe' ? 'selected' : ''}>Stripe</option>
                <option value="kiwify" ${cfg.paymentProvider === 'kiwify' ? 'selected' : ''}>Kiwify Webhook</option>
                <option value="custom" ${cfg.paymentProvider === 'custom' ? 'selected' : ''}>Webhook Próprio</option>
              </select>
            </div>
            <div class="form-group">
              <label>Token / Chave Secreta</label>
              <input type="text" id="api-key" value="${cfg.apiKey || ''}" placeholder="Token da sua conta">
            </div>
            <div class="form-group">
              <label>URL de Webhook</label>
              <input type="url" id="api-endpoint" value="${cfg.endpointUrl || ''}" placeholder="https://seusite.com.br/webhook">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
              <div class="form-group">
                <label>Ambiente</label>
                <select id="api-env" style="width:100%">
                  <option value="sandbox" ${cfg.environment === 'sandbox' ? 'selected' : ''}>Sandbox (Testes)</option>
                  <option value="production" ${cfg.environment === 'production' ? 'selected' : ''}>Produção</option>
                </select>
              </div>
              <div class="form-group">
                <label>Chave Pix</label>
                <input type="text" id="api-pix-key" value="${cfg.pixKey || 'netoinvest.contato@pagamentos.com.br'}">
              </div>
            </div>
            <div id="api-test-result" style="display:none;margin:4px 0;font-size:12px;padding:8px;border-radius:6px;"></div>
            <div style="display:flex;gap:10px;">
              <button type="button" class="ghost" style="flex:1;" onclick="window.PlatUI.testApiConnection()">Testar Conexão</button>
              <button type="submit" class="pri" style="flex:1;">Salvar</button>
            </div>
          </form>
        </div>`;
      document.body.appendChild(modalEl);
    }

    saveApiSettings(e) {
      e.preventDefault();
      window.ApiService && window.ApiService.saveConfig({
        paymentProvider: document.getElementById('api-provider')?.value,
        apiKey: document.getElementById('api-key')?.value,
        endpointUrl: document.getElementById('api-endpoint')?.value,
        environment: document.getElementById('api-env')?.value,
        pixKey: document.getElementById('api-pix-key')?.value
      });
      document.getElementById('api-settings-modal')?.remove();
      this.showToast('Configurações salvas!');
    }

    async testApiConnection() {
      const box = document.getElementById('api-test-result');
      if (!box) return;
      box.style.display = 'block';
      box.style.background = 'var(--sunk)';
      box.style.color = 'var(--ink)';
      box.textContent = 'Testando…';
      window.ApiService && window.ApiService.saveConfig({
        paymentProvider: document.getElementById('api-provider')?.value,
        apiKey: document.getElementById('api-key')?.value,
        endpointUrl: document.getElementById('api-endpoint')?.value,
        environment: document.getElementById('api-env')?.value,
        pixKey: document.getElementById('api-pix-key')?.value
      });
      const res = window.ApiService ? await window.ApiService.testConnection() : { success: false, message: 'ApiService não disponível' };
      if (res.success) {
        box.style.background = 'var(--good-soft)'; box.style.color = 'var(--good)';
        box.textContent = '✓ ' + res.message;
      } else {
        box.style.background = 'var(--bad-soft)'; box.style.color = 'var(--bad)';
        box.textContent = '✕ ' + res.message;
      }
    }
  }

  window.PlatUI = new PlatUI();
  // Alias para compatibilidade com modais de checkout
  window.AppUI = { 
    openAuthModal: (t) => window.PlatUI.openAuthModal(t),
    showToast: (m) => window.PlatUI.showToast(m)
  };

  // Expõe getCur para renderTabs
  if (window.NetoPlatform) {
    window.NetoPlatform.getCur = () => window.NetoPlatform._cur || 'ranking';
  }

  // Expor TerminalApp.goToTab para ptab onclick
  window.TerminalApp = window.TerminalApp || {};
  const _origGoToTab = window.TerminalApp.goToTab;
  window.TerminalApp.goToTab = function(tabId) {
    if (_origGoToTab) _origGoToTab.call(window.TerminalApp, tabId);
    window.PlatUI.renderTabs();
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => window.PlatUI.init());
  } else {
    window.PlatUI.init();
  }

})(window);
</script>

</body>
</html>
